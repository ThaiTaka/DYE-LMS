<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <radialGradient id="tim" cx="78%" cy="38%" r="46%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#6d28d9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b0f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="xanh" cx="100%" cy="90%" r="42%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0b0f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hong" cx="58%" cy="8%" r="30%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".7"/>
      <stop offset="1" stop-color="#0b0f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cau" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset=".35" stop-color="#c084fc"/>
      <stop offset=".7" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="quang" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#a78bfa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luoiMo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="tia" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f9a8d4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="san"><rect x="0" y="330" width="1600" height="270"/></clipPath>
  </defs>

  <rect width="1600" height="600" fill="#0b0f24"/>
  <rect width="1600" height="600" fill="url(#tim)"/>
  <rect width="1600" height="600" fill="url(#xanh)"/>
  <rect width="1600" height="600" fill="url(#hong)"/>

  <!-- Stars: three sizes, hand-placed so none lands under the headline on the left. -->
  <g fill="#f8fafc">
    <g opacity=".9">
      <circle cx="640" cy="70" r="1.6"/><circle cx="905" cy="140" r="1.4"/><circle cx="1120" cy="60" r="1.8"/>
      <circle cx="1310" cy="120" r="1.5"/><circle cx="1490" cy="55" r="1.6"/><circle cx="1010" cy="240" r="1.3"/>
      <circle cx="1440" cy="250" r="1.7"/><circle cx="760" cy="200" r="1.2"/><circle cx="1255" cy="300" r="1.5"/>
    </g>
    <g opacity=".55">
      <circle cx="700" cy="120" r="1"/><circle cx="830" cy="40" r="1"/><circle cx="960" cy="90" r="1"/>
      <circle cx="1060" cy="170" r="1"/><circle cx="1200" cy="30" r="1"/><circle cx="1380" cy="190" r="1"/>
      <circle cx="1540" cy="150" r="1"/><circle cx="1150" cy="290" r="1"/><circle cx="880" cy="270" r="1"/>
      <circle cx="1330" cy="40" r="1"/><circle cx="1470" cy="330" r="1"/><circle cx="1570" cy="260" r="1"/>
    </g>
    <g opacity=".3">
      <circle cx="620" cy="180" r=".8"/><circle cx="740" cy="30" r=".8"/><circle cx="990" cy="20" r=".8"/>
      <circle cx="1090" cy="120" r=".8"/><circle cx="1230" cy="200" r=".8"/><circle cx="1400" cy="90" r=".8"/>
      <circle cx="1520" cy="210" r=".8"/><circle cx="1280" cy="250" r=".8"/><circle cx="820" cy="160" r=".8"/>
    </g>
  </g>

  <!-- Perspective grid on the floor — the "digital horizon". -->
  <g clip-path="url(#san)" stroke="url(#luoiMo)" stroke-width="1" fill="none" opacity=".7">
    <path d="M800 330 L-400 600 M800 330 L-100 600 M800 330 L200 600 M800 330 L500 600 M800 330 L800 600 M800 330 L1100 600 M800 330 L1400 600 M800 330 L1700 600 M800 330 L2000 600"/>
    <path d="M0 345 H1600 M0 362 H1600 M0 382 H1600 M0 406 H1600 M0 436 H1600 M0 472 H1600 M0 516 H1600 M0 568 H1600"/>
  </g>
  <rect x="0" y="328" width="1600" height="2" fill="url(#tia)"/>

  <!-- The planet: a glow, the sphere, a tilted ring. -->
  <circle cx="1230" cy="250" r="230" fill="url(#quang)"/>
  <circle cx="1230" cy="250" r="118" fill="url(#cau)"/>
  <ellipse cx="1230" cy="262" rx="215" ry="46" fill="none" stroke="#f9a8d4" stroke-opacity=".75" stroke-width="3" transform="rotate(-14 1230 262)"/>
  <ellipse cx="1230" cy="262" rx="235" ry="56" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.5" transform="rotate(-14 1230 262)"/>

  <!-- Circuit traces, bottom right: the robotics half of the platform. -->
  <g fill="none" stroke="#60a5fa" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
    <path d="M1600 420 H1500 L1470 450 H1380"/>
    <path d="M1600 470 H1520 L1490 500 H1420 L1400 520 H1330"/>
    <path d="M1600 530 H1540 L1510 560 H1450"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="1380" cy="450" r="4"/><circle cx="1330" cy="520" r="4"/><circle cx="1450" cy="560" r="4"/>
  </g>

  <!-- A small orbiting moon and a shooting star. -->
  <circle cx="1050" cy="150" r="14" fill="#c4b5fd" fill-opacity=".9"/>
  <circle cx="1046" cy="146" r="4" fill="#f5f3ff"/>
  <path d="M560 60 L700 120" stroke="url(#tia)" stroke-width="2" stroke-linecap="round"/>
</svg>
