# DYE LMS — development stack
#
#   docker compose up
#
# brings up Postgres, Redis and MinIO, then runs `prisma migrate deploy`
# followed by the curriculum seed. The database is fully populated with the
# real 3-course / 90-lesson curriculum on first boot. The seed is idempotent,
# so restarting never duplicates content.
#
# Application services (web, judge-worker) are added in later phases.

name: dye-lms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dye_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dye_lms}
      # Deterministic collation so ORDER BY on Vietnamese titles is stable
      # across host platforms.
      LANG: C.UTF-8
    ports:
      - '${POSTGRES_PORT:-5442}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dye} -d ${POSTGRES_DB:-dye_lms}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_PORT:-6389}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dye_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dye_minio_dev_password_change_me}
    ports:
      - '${MINIO_PORT:-9010}:9000'
      - '${MINIO_CONSOLE_PORT:-9011}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the project bucket and lock it down. Uploaded student
  # assets are never publicly listable; the app issues short-lived presigned
  # URLs instead.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dye_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dye_minio_dev_password_change_me}
      S3_BUCKET: ${S3_BUCKET:-dye-projects}
    entrypoint: >
      /bin/sh -c "
      mc alias set dye http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing dye/$$S3_BUCKET &&
      mc anonymous set none dye/$$S3_BUCKET &&
      echo 'minio-init: bucket '$$S3_BUCKET' ready (private)'
      "
    restart: 'no'

  # One-shot: apply migrations, then seed the real curriculum.
  db-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://dye:dye_dev_password_change_me@postgres:5432/dye_lms?schema=public}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DyeLms#2026}
      SEED_ALLOW_PRODUCTION: ${SEED_ALLOW_PRODUCTION:-no}
    command: ['sh', '-c', 'npx prisma migrate deploy && npx prisma db seed']
    restart: 'no'

  # The judge worker. Behind a profile, so `docker compose up` does NOT start it
  # by default:
  #
  #     docker compose --profile judge up -d judge-worker
  #
  # ── Why it is opt-in ──────────────────────────────────────────────────────
  # It mounts the host's Docker socket, which grants effective root on the host
  # to whatever holds it. That is a deliberate, visible choice rather than
  # something that happens the first time someone runs `docker compose up`.
  #
  # For local development the better path is to run it on the host instead:
  #
  #     npm run judge:dev
  #
  # which needs no socket mount at all, because it already runs where the
  # daemon is. The sandbox containers this worker starts never see the socket —
  # asserted by a test in apps/judge-worker/src/sandbox.test.ts.
  judge-worker:
    profiles: ['judge']
    build:
      context: .
      dockerfile: apps/judge-worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://dye:dye_dev_password_change_me@postgres:5432/dye_lms?schema=public}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-4}
      JUDGE_MAX_MEMORY_MB: ${JUDGE_MAX_MEMORY_MB:-256}
      JUDGE_MAX_TIME_MS: ${JUDGE_MAX_TIME_MS:-10000}
      JUDGE_OUTPUT_LIMIT_BYTES: ${JUDGE_OUTPUT_LIMIT_BYTES:-262144}
    volumes:
      # Sibling containers, not nested Docker. See the note above.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
